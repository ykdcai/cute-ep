[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "quack-kernels"
dynamic = ["version"]
# 3.11+: the CUDA-13 wheels (nvshmem4py-cu13, cuda-bindings) have no 3.10 build.
# uv resolves every extra across the whole range, so one 3.10-incompatible dep
# made the lock unsolvable -- which is why commands needed `uv run --no-sync`.
requires-python = ">=3.11"

# CUDA 13 throughout. Serves B200 (sm100) and H100 (sm90) from the same wheels.
dependencies = [
    # [cu13] is required, not optional: the bare package pulls the cu12 libs.
    "nvidia-cutlass-dsl[cu13]>=4.5.2,<4.6",  # <4.6: 4.6.x is an unvalidated bump
    "torch",                                 # cu130 index, see [tool.uv.sources]
    "apache-tvm-ffi>=0.1.6,<0.2",
    "torch-c-dlpack-ext",
    "einops",
    "cuda-bindings",    # cuda.bindings.driver -- quack kernels + tilepipe
    "cuda-core",        # cuda.core           -- tilepipe/moe_comm.py
    "nvshmem4py-cu13",  # nvshmem.core        -- tilepipe plan/moe_comm/gemm_combine
]

[project.optional-dependencies]
cu13 = ["nvidia-cutlass-dsl[cu13]>=4.5.2"]  # now redundant; kept for compatibility
heuristics = ["nvidia-matmul-heuristics"]
bench = ["pandas"]
dev = ["pre-commit", "pytest", "pytest-xdist", "ruff"]

# Groups, unlike extras, are installed by a bare `uv run` (see default-groups).
[dependency-groups]
baselines = ["flashinfer-python"]           # tilepipe/baselines/* only
dev = ["pre-commit", "pytest", "pytest-xdist", "ruff"]  # mirrors the dev extra

[tool.setuptools.packages.find]
where = ["."]
include = ["quack*", "tilepipe*"]

[tool.setuptools.dynamic]
version = {attr = "quack.__version__"}

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
# What a bare `uv run` installs. This REPLACES uv's built-in ["dev"] rather than
# extending it, so "dev" must be listed or pytest/ruff/pre-commit get pruned.
default-groups = ["dev", "baselines"]

# torch pins nvidia-cudnn-cu13==9.20.0.48, but flashinfer's grouped_mm_bf16
# refuses to run below 9.21 ("requires backend version >= 92100, found 92000"),
# so the two cannot both be satisfied. torch works fine with the newer cuDNN;
# flashinfer does not work with the older one, so override torch's pin. Without
# this, `uv sync` silently downgrades cuDNN and every baseline run dies.
override-dependencies = ["nvidia-cudnn-cu13>=9.21.1.3"]

# torch always from the CUDA-13 index. Gating this on `extra == 'cu13'` meant a
# plain sync resolved torch from PyPI and replaced the +cu130 build, while
# nvshmem4py-cu13 requires the CUDA 13 stack regardless.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130" },
]

[tool.pytest.ini_options]
# Disable pytest plugins we don't need. These add per-test hook dispatch and
# session-end work that costs ~1-2s on a 2k-test file with no functional
# benefit for quack's CI workflow:
#   - cacheprovider:        .pytest_cache/ lastfailed bookkeeping (writes to disk per session)
#   - unraisableexception:  3x gc.collect() at session end to flush sys.unraisablehook (0.6s)
#   - threadexception:      same idea for threading.excepthook (~tens of ms)
# Disabling these is safe: pytest reports test failures the same way; we just
# lose the rarely-useful "there was an unraisable exception during test X"
# secondary report. Tests still fail normally on real errors.
addopts = "-p no:cacheprovider -p no:unraisableexception -p no:threadexception"

# Filters set via warnings.filterwarnings() in conftest.py don't survive pytest's
# per-test catch_warnings context — pytest prepends its own ('always', Warning)
# filter, which then matches before any conftest 'ignore'. Filters declared here
# are installed by pytest *after* its 'always', so they actually win.
#
# torch.compile / Inductor scripts dynamically-created methods via the
# deprecated torch.jit.script_method during tracing, firing 300+ deprecation
# warnings per --compile-only run. Suppress at the source module.
filterwarnings = [
    "ignore:`torch\\.jit\\.script_method`.*Please switch to `torch\\.compile` or `torch\\.export`\\.:DeprecationWarning:torch\\.jit\\._script",
    # torch.profiler.profile() unconditionally warns when acc_events=False (the
    # default) about events being cleared at each cycle. Our tests profile a
    # single kernel launch in one cycle, so the warning is irrelevant. Silence
    # at source rather than threading acc_events=True through every call site.
    # NOTE: filterwarnings uses ':' as field separator, so the message regex
    # cannot contain literal colons — match a colon-free substring instead.
    "ignore:.*Profiler clears events at the end of each cycle.*:UserWarning:torch\\.profiler\\.profiler",
]

[tool.ruff]
line-length = 100
exclude = [".#*"]

[tool.ruff.lint]
# State the rule set explicitly instead of inheriting ruff's default, which is
# not stable across versions: 0.16 added UP/I/SIM/C4/RUF/PLR to the default
# select and turned 4 findings into 1437 without any code changing. These are
# ruff's classic defaults, which the codebase's style was written against.
select = ["E4", "E7", "E9", "F"]
extend-select = ["B904"]
ignore = [
    "E731",  # do not assign a lambda expression, use a def
    "E741",  # Do not use variables named 'I', 'O', or 'l'
    "F841",  # local variable is assigned to but never used
]
